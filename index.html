<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#57524C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="神泣">
<title>神泣 · 物品栏</title>
<link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logos/favicon-16.png">
<link rel="apple-touch-icon" href="logos/apple-touch-icon-180.png">

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Liu+Jian+Mao+Cao&family=Ma+Shan+Zheng&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;   /* 关闭 iOS 长按选择气泡/放大镜 */
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none; /* 全局禁选中 */
  -webkit-user-drag:none;}      /* 禁图片/元素拖拽 */
img{-webkit-user-drag:none;}
img::selection,img::-moz-selection{background:transparent;}
html,body{height:100%;}
body{
  position:fixed;left:0;top:0;width:100%;height:100%;
  overflow:hidden;                 /* 整页固定，不晃动、不滚动 */
  overscroll-behavior:none;        /* 禁止下拉刷新/回弹 */
  touch-action:none;               /* 触控手势全交给 JS，杜绝整页下拉 */
  background:#57524C;
  color:#e7e1d2;
  font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ===== 舞台：物品栏所在，与手机边缘留小间隔 ===== */
.stage{
  min-height:100%;
  padding:
    calc(env(safe-area-inset-top,0px) + 4px)
    calc(env(safe-area-inset-right,0px) + 10px)
    calc(env(safe-area-inset-bottom,0px) + 6px)
    calc(env(safe-area-inset-left,0px) + 10px);
  max-width:360px;margin:0 auto;   /* 收窄页面：6 列背包凹槽贴近 46px，显示紧凑 */
}
/* 属性页单独加宽 50px：窗口约 390px，主页面不受影响 */
body.show-attrs .stage{max-width:410px;}

/* ===== 物品栏整体窗口：边框 + 紧收外阴影 ===== */
.window{
  background:linear-gradient(180deg,#3A352F,#151210);
  border:1px solid #6D6354;
  border-radius:8px;
  box-shadow:0 2px 7px rgba(0,0,0,.5);
  padding:4px 8px 10px;
}

/* ===== 顶栏：物品栏（白字） ===== */
.topbar{
  display:flex;align-items:center;justify-content:center;
  height:26px;margin-bottom:2px;position:relative;
}
.topbar::before,.topbar::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,#6D6354,transparent);}
.topbar h1{
  position:relative;z-index:1;
  font-size:17px;font-weight:600;letter-spacing:2px;padding:0 16px;
  color:#ffffff;text-shadow:0 1px 2px rgba(0,0,0,.9);
}

/* ===== 面板通用 ===== */
.panel{border-radius:6px;}

/* ===== 第一部分：装备面板 ===== */
.equip-panel{
  background:linear-gradient(180deg,#282A2A,#262320);   /* 装备面板底色 */
  border:1px solid #5A5550;
  margin:0 2px 2px;   /* 左右外边距与背包面板一致，内容到窗口边界的间距相等 */
  padding:7px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.equip{
  display:grid;grid-template-columns:repeat(4,auto);
  justify-content:space-between;align-items:center;gap:10px 16px;
  width:75%;margin:0 auto;   /* 凹槽区占面板宽度 3/4，左右留白加大 */
}
.eq-cell{display:flex;}
.equip .slot{width:48px;height:48px;}
.equip .slot.small{width:28px;height:28px;}   /* 小槽：约为大槽面积的 1/4（+2px） */
.slot .hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:1px;color:rgba(232,225,210,.26);
  pointer-events:none;white-space:nowrap;
}

/* ===== 第二部分：背包面板（Tab 下缘对齐、顶部向上拉升、各自分隔） ===== */
.bag-area{
  position:relative;
  background:linear-gradient(180deg,
    transparent 0px, transparent 34px,     /* tab 带透明，面板从 tab 下边线(34px)才开始 */
    #191818 34px, #191513 100%);           /* 面板底色：tab 头部高于面板 */
  border-bottom:1px solid #685F55;         /* 左右边线由伪元素绘制，从 tab 下边线开始 */
  border-radius:0 0 6px 6px;
  margin:0 2px 5px;        /* 与装备面板间距收紧 */
  padding:34px 8px 8px;
}
.bag-area::before,.bag-area::after{
  content:"";position:absolute;top:34px;bottom:0;width:1px;background:#685F55;
}
.bag-area::before{left:0;}
.bag-area::after{right:0;}
.bag-tabs{
  display:flex;gap:6px;align-items:flex-end;   /* 底部持平，选中向上略抬 */
  position:absolute;top:0;left:0;right:0;z-index:1;
}
.bag-tab{
  flex:1;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#8a8375;
  background:linear-gradient(180deg,#232120,#161413);   /* 未选中 */
  border:1px solid #685F55;        /* 默认边框与选中同色 */
  border-radius:5px 5px 0 0;
  cursor:pointer;
}
/* 首/末 Tab 保留左右边线，与外层边框重合只显示一条（tab 边线盖住外层边线） */
.bag-tab:first-child{border-left:1px solid #685F55;}
.bag-tab:last-child{border-right:1px solid #685F55;}
.bag-tab.on:first-child{border-left:1px solid #685F55;}
.bag-tab.on:last-child{border-right:1px solid #685F55;}
.bag-tab.on{
  height:34px;color:#ffffff;font-weight:600;   /* 选中略抬高（比默认高 6px）、底部持平、下部边线隐藏连通凹槽 */
  background:#191818;
  border:1px solid #685F55;border-bottom:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.bag-grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:6px;padding-top:10px;   /* 凹槽与 Tab 下缘留出间隔 */
  touch-action:none;   /* 允许槽位内触控拖拽 */
}
.bag-grid .slot{width:46px;height:46px;justify-self:center;}   /* 46px 固定，6 等分列内居中，不换行 */

/* ===== 拖拽态 ===== */
.drag-ghost{
  position:fixed;width:46px;height:46px;left:0;top:0;
  transform:translate(-50%,-50%);
  will-change:transform;            /* 用 transform 跟随手指，避免布局抖动 */
  pointer-events:none;z-index:9999;opacity:.92;
  border:1px solid rgba(255,255,255,.3);border-radius:5px;
  box-shadow:0 5px 16px rgba(0,0,0,.75);
  background:#212020;
}
.drag-ghost img{width:100%;height:100%;object-fit:contain;}
.drag-ghost .fill{position:absolute;inset:0;background:var(--c);border-radius:5px;}
.drag-ghost .qty{position:absolute;right:2px;bottom:1px;font-size:9px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;}
.slot.drag-from{opacity:.35;}
.slot.drag-over{box-shadow:inset 0 0 0 2px rgba(214,173,90,.75), 0 0 8px rgba(214,173,90,.3);}
.bag-tab.drag-tab-over{box-shadow:inset 0 0 0 2px rgba(214,173,90,.85), 0 0 10px rgba(214,173,90,.35);}
.eq-cell.drag-over .slot{box-shadow:inset 0 0 0 2px rgba(214,173,90,.75), 0 0 8px rgba(214,173,90,.3);}

/* ===== 凹槽：空槽 #212020 + 边框 #5E5E5E + 内凹凹陷 ===== */
.slot{
  position:relative;
  border-radius:5px;
  background:
    radial-gradient(150% 170% at 50% 30%, #2b2a28 0%, #201f1e 45%, #141312 100%);
  border:1px solid #5E5E5E;
  box-shadow:
    inset 0 4px 7px rgba(0,0,0,.95),
    inset 1px 0 4px rgba(0,0,0,.7),
    inset -1px 0 3px rgba(0,0,0,.55),
    inset 0 -2px 3px rgba(255,255,255,.05),
    0 1px 1px rgba(0,0,0,.55);
  cursor:pointer;
  transition:transform .06s ease;
}
.slot::before{
  content:"";position:absolute;inset:2px;border-radius:4px;
  border:1px solid rgba(0,0,0,.45);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5), inset 0 -1px 1px rgba(255,255,255,.03);
  pointer-events:none;
}
.slot:active{transform:translateY(1px);}

/* 已放置物品 */
.slot .fill{
  position:absolute;inset:4px;border-radius:4px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.20),rgba(255,255,255,0) 42%),var(--c);
  border:1px solid rgba(0,0,0,.55);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.15);
}
.slot .qty{
  position:absolute;right:4px;bottom:2px;font-size:9px;font-weight:600;color:#fff;
  text-shadow:0 1px 2px #000;pointer-events:none;
}
/* 已放置物品：图片铺满凹槽，四周内凹阴影（读取自 logos/） */
.slot .item-img{
  position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);
  object-fit:contain;pointer-events:none;border-radius:4px;
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.85),
    inset 1px 0 5px rgba(0,0,0,.5),
    inset -1px 0 5px rgba(0,0,0,.5),
    inset 0 -2px 4px rgba(0,0,0,.5);
}

/* ===== 下部：金币 + 分割线 + 按钮 ===== */
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 4px 0;}
.money-box{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:4px 10px;border-radius:5px;
  background:#100F0D;                 /* 金币槽 */
  border:1px solid #3a352e;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.65);
}
.money-box .coin{flex:0 0 auto;width:20px;height:20px;}
.money-box .coin svg{width:100%;height:100%;filter:drop-shadow(0 0 4px rgba(230,190,80,.3));}
.money-box .val{font-size:14px;font-weight:400;color:rgb(233,205,140);font-variant-numeric:tabular-nums;letter-spacing:0;}
.money-box.bound .coin svg{filter:drop-shadow(0 0 4px rgba(120,160,220,.28));}
.money-box.bound .val{color:rgb(158,186,226);}

.divider{
  height:1px;margin:5px 6px;
  background:linear-gradient(90deg,transparent,#6D6354 20%,#6D6354 80%,transparent);
}

.actions{display:flex;flex-direction:column;gap:5px;margin:0 4px 16px;}   /* 按钮下方留白加大 */
.act-row{display:flex;gap:6px;justify-content:center;}
.act-row.c4 .btn{flex:1;max-width:86px;}
.btn{
  position:relative;
  height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;letter-spacing:2px;color:#e7e1d2;
  background:linear-gradient(180deg,#1d1b19,#121110);
  border:1px solid #000;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -2px 4px rgba(0,0,0,.6),
    0 2px 5px rgba(0,0,0,.5);
  cursor:pointer;
}
.btn::before{
  content:"";position:absolute;inset:1px;border-radius:5px;
  border:1px solid rgba(214,173,90,.18);pointer-events:none;
}
.btn:active{
  transform:translateY(1px);
  background:linear-gradient(180deg,#141311,#0c0b0a);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  transform:translateX(-50%) translateY(12px);
  background:rgba(12,11,10,.94);
  border:1px solid #6D6354;
  color:#e7e1d2;font-size:13px;letter-spacing:1px;
  padding:9px 16px;border-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
  max-width:80%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  z-index:99;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 二级页面：角色属性（参考游戏属性面板布局） ===== */
.attrs{display:none;padding:4px 0 10px;}   /* 覆盖 .window 的左右内边距，让面板贴近页面边线 */
.attrs-body{padding:2px 2px 12px;}
.attrs .topbar{justify-content:center;}
.attrs .back-arrow{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:34px;height:28px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;
}
.attrs .back-arrow svg{
  width:20px;height:20px;
  stroke:#cfc4a8;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
}
.attrs .back-arrow:active svg{opacity:.45;}
.title-glow{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:210px;height:20px;
  background:radial-gradient(ellipse at center,
    rgba(166,118,52,1) 0%,rgba(166,118,52,.55) 42%,
    rgba(166,118,52,.15) 66%,rgba(166,118,52,0) 84%);
  filter:blur(3px);
  pointer-events:none;z-index:0;
}
/* ===== 属性页第一部分：角色信息 ===== */
.info-panel{background:transparent;border:none;padding:6px 14px 2px;margin-bottom:14px;}
.info-row{display:flex;justify-content:space-between;align-items:baseline;}
.info-name{font-size:18px;color:#ecd9a0;font-weight:400;}
.info-lv{font-size:13px;color:#c9bfa8;font-variant-numeric:tabular-nums;}
.info-cls{margin-top:6px;font-size:12px;color:#c9bfa8;letter-spacing:1px;}
/* ===== 属性页第二部分：分配属性点（整块含标题） ===== */
.attrs-panel{
  background:linear-gradient(180deg,#282A2A,#262320);
  border:1px solid #5A5550;border-radius:6px;
  padding:4px 16px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.panel-title{
  font-size:14px;color:#ffffff;font-weight:300;letter-spacing:2px;
  text-align:center;padding:8px 0;position:relative;
}
.panel-title::after{
  content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,#6D6354 25%,#6D6354 75%,transparent);
}
/* 分配属性点 / 战斗属性 统一行：两列各占一半，标题左对齐、值右对齐 */
.c-row{
  display:flex;align-items:center;gap:30px;
  padding:8px 0;border-bottom:1px solid rgba(109,99,84,.12);
}
.c-row:last-child{border-bottom:none;}
.c-pair{
  flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.c-pair .cl{font-size:13px;color:#E0B900;font-weight:500;}
.c-pair .cv{font-size:14px;color:#ffffff;font-weight:300;font-variant-numeric:tabular-nums;}
/* 第二部分每列的值所在格背景铺满整列 */
#attr-alloc .cv{
  flex:1;
  background:#161618;
  padding:2px 9px;border-radius:4px;
  text-align:right;
}
.alloc-points{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-top:2px;padding:9px 0 2px;border-top:1px solid rgba(109,99,84,.22);
}
.alloc-points .cl{font-size:13px;color:#E0B900;font-weight:500;}
.alloc-points b{font-weight:300;color:#ffffff;font-variant-numeric:tabular-nums;}
.combat-divider{
  height:1px;margin:10px 16px;
  background:linear-gradient(90deg,transparent,#6D6354 25%,#6D6354 75%,transparent);
}
/* 第三部分（战斗属性/战绩）无面板，行距页面边线 16px（attrs-body 2px + 内补 14px） */
#combat-list, #record-list{padding:0 14px;}

/* ===== 页面顶部标题：晓夜之歌（草书 + Google 多彩） ===== */
.page-title{
  text-align:center;
  padding:2px 0 6px;
  font-family:'Liu Jian Mao Cao','Ma Shan Zheng','STXingkai','华文行楷','KaiTi','楷体',cursive;
  font-size:36px;line-height:1;letter-spacing:8px;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.page-title span{display:inline-block;margin:0 3px;transform:translateY(1px);}
.page-title .c1{color:#4285F4;}
.page-title .c2{color:#EA4335;}
.page-title .c3{color:#FBBC05;}
.page-title .c4{color:#34A853;}

/* ===== 页面转场：顶级体验（打开 / 返回统一过渡） ===== */
/* 备用方案（不支持 View Transitions 的浏览器）：进入页滑动淡入 */
.view-enter{animation:pageIn .3s ease-out both;}
@keyframes pageIn{
  from{opacity:0;transform:translateX(24px);}
  to{opacity:1;transform:none;}
}
/* View Transitions：旧页淡出左滑、新页淡入右进，丝滑切换 */
::view-transition-old(root){
  animation:vtOut .24s ease-in both;
}
::view-transition-new(root){
  animation:vtIn .3s ease-out both;
}
@keyframes vtOut{
  from{opacity:1;}
  to{opacity:.12;transform:translateX(-16px) scale(.992);}
}
@keyframes vtIn{
  from{opacity:.22;transform:translateX(22px) scale(.996);}
  to{opacity:1;transform:none;}
}
</style>
</head>
<body>
<div class="stage">
  <div class="page-title"><span class="c1">晓</span><span class="c2">夜</span><span class="c3">之</span><span class="c4">歌</span></div>
  <div class="window" id="view-main">

    <!-- ===== 顶栏：物品栏（白字） ===== -->
    <header class="topbar"><span class="title-glow"></span><h1>物品栏</h1></header>

    <!-- ===== 第一部分：装备面板 ===== -->
    <section class="panel equip-panel"><div id="equip" class="equip"></div></section>

    <!-- ===== 第二部分：背包面板 ===== -->
    <div class="bag-area">
      <div id="bag-tabs" class="bag-tabs"></div>
      <div id="bag-grid" class="bag-grid"></div>
    </div>

    <!-- ===== 下部：金币 / 分割线 / 按钮 ===== -->
    <div class="money">
      <div class="money-box">
        <span class="coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e0b45a"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#8a6a2a" stroke-width="1.2"/><path d="M12 8.6v6.8M8.6 12h6.8" stroke="#8a6a2a" stroke-width="1.4" stroke-linecap="round"/></svg></span>
        <span id="gold-trade" class="val">1,195,630</span>
      </div>
      <div class="money-box bound">
        <span class="coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#5b86c9"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#2b4a78" stroke-width="1.2"/><path d="M12 8.6v6.8M8.6 12h6.8" stroke="#2b4a78" stroke-width="1.4" stroke-linecap="round"/></svg></span>
        <span id="gold-bind" class="val">1,004,727</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="actions" id="actions">
      <div class="act-row c4">
        <button class="btn" data-act="属性">属性</button>
        <button class="btn" data-act="强化">强化</button>
        <button class="btn" data-act="宝石">宝石</button>
        <button class="btn" data-act="寻宝">寻宝</button>
      </div>
      <div class="act-row c4">
        <button class="btn" data-act="天神">天神</button>
        <button class="btn" data-act="翅膀">翅膀</button>
        <button class="btn" data-act="洗炼">洗炼</button>
        <button class="btn" data-act="初始化">初始化</button>
      </div>
    </div>

  </div>
  <!-- ===== 二级页面：角色属性 ===== -->
  <div class="window attrs" id="view-attrs">
    <header class="topbar">
      <span class="title-glow"></span>
      <button class="back-arrow" id="attrs-back" aria-label="返回">
        <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
      </button>
      <h1>角色属性</h1>
    </header>
    <div class="attrs-body">
      <!-- 第一部分：角色信息 -->
      <div class="info-panel">
        <div class="info-row">
          <span class="info-name" id="ch-name"></span>

/* ============ 物品工厂 + 初始化物品生成 ============ */
var itemIdCounter = 1;
function createItem(blueprint, overrides){
  var item = JSON.parse(JSON.stringify(blueprint));
  if (overrides){ for (var k in overrides) item[k] = overrides[k]; }
  if (item.count === undefined) item.count = 1;
  return item;
}
function buildInitialItems(){
  var items = [];
  function addItem(blueprint, count, overrides){
    count = count || 1;
    var ov = overrides || {};
    for (var i = 0; i < count; i++){
      ov.id = itemIdCounter++;
      items.push(createItem(blueprint, ov));
    }
  }
  /* 装备（各1件） */
  addItem(ITEM_BLUEPRINTS.epicOgdenHelmet);
  addItem(ITEM_BLUEPRINTS.epicOgdenChest);
  addItem(ITEM_BLUEPRINTS.epicOgdenGloves);
  addItem(ITEM_BLUEPRINTS.epicOgdenLeggings);
  addItem(ITEM_BLUEPRINTS.epicOgdenBoots);
  addItem(ITEM_BLUEPRINTS.demonWings);
  /* 首饰 */
  addItem(ITEM_BLUEPRINTS.dominationNecklace);
  addItem(ITEM_BLUEPRINTS.dominationRing);
  addItem(ITEM_BLUEPRINTS.dominationRing);
  addItem(ITEM_BLUEPRINTS.dominationBracelet);
  addItem(ITEM_BLUEPRINTS.dominationBracelet);
  /* 天神牌子 */
  addItem(ITEM_BLUEPRINTS.warGodsFavor, 2);
  addItem(ITEM_BLUEPRINTS.adamBone);
  addItem(ITEM_BLUEPRINTS.mercuryRam);
  addItem(ITEM_BLUEPRINTS.warGodsPowerRune);
  addItem(ITEM_BLUEPRINTS.omniscientOracle);
  addItem(ITEM_BLUEPRINTS.godsPraise);
  addItem(ITEM_BLUEPRINTS.godsTrustRune);
  /* 材料 & 祝福宝石 */
  addItem(ITEM_BLUEPRINTS.runeFragment);
  addItem(ITEM_BLUEPRINTS.sealFragment);
  addItem(ITEM_BLUEPRINTS.earthBlessingGem);
  addItem(ITEM_BLUEPRINTS.fireBlessingGem);
  addItem(ITEM_BLUEPRINTS.waterBlessingGem);
  addItem(ITEM_BLUEPRINTS.windBlessingGem);
  addItem(ITEM_BLUEPRINTS.godPowerFragment);
  addItem(ITEM_BLUEPRINTS.godCrystal);
  /* 属性宝石 */
  ITEM_BLUEPRINTS.statGems.forEach(function(gem){ addItem(gem); });
  /* 镶嵌 / 拆卸锤 */
  ITEM_BLUEPRINTS.hammers.forEach(function(h){ addItem(h); });
  ITEM_BLUEPRINTS.extractHammers.forEach(function(h){ addItem(h); });
  return items;
}
/* 寻宝掉落池：所有已定义物品 */
function buildLootPool(){
  var pool = [];
  for (var key in ITEM_BLUEPRINTS){
    var b = ITEM_BLUEPRINTS[key];
    if (Object.prototype.toString.call(b) === '[object Array]') pool = pool.concat(b);
    else pool.push(b);
  }
  return pool;
}
var LOOT_POOL = buildLootPool();

/* 预加载全部物品图，避免初始化/穿戴时现场拉取导致显示慢 */
(function(){
  var seen = {};
  function pre(img){ if (img && !seen[img]){ seen[img] = 1; var im = new Image(); im.src = img; } }
  for (var key in ITEM_BLUEPRINTS){
    var b = ITEM_BLUEPRINTS[key];
    if (Object.prototype.toString.call(b) === '[object Array]'){ b.forEach(function(x){ pre(x.img); }); }
    else pre(b.img);
  }
})();

/* 兜底：禁止任何原生触屏滚动/下拉刷新，整页固定 */
document.addEventListener('touchmove', function(e){ if (e.cancelable) e.preventDefault(); }, { passive:false });


var $ = function(s){ return document.querySelector(s); };
var equipEl = $('#equip'), tabsEl = $('#bag-tabs'), gridEl = $('#bag-grid'), toastEl = $('#toast');
var toastTimer = null;

/* ===== 音效管理：复用预加载的单实例音频，播放即时、不卡顿、不累积 ===== */
function createPreloadedAudio(src){
  var audio = new Audio(src);
  audio.preload = 'auto';
  return audio;
}
var soundEffects = {
  weapon:  createPreloadedAudio('sound/武器.mp3'),
  jewelry: createPreloadedAudio('sound/首饰.mp3'),
  armor:   createPreloadedAudio('sound/衣服.mp3')
};
/* iOS 首次触摸时解锁音频，之后播放即时无延迟 */
document.addEventListener('pointerdown', function prime(){
  for (var k in soundEffects){
    var a = soundEffects[k];
    try {
      a.volume = 0;
      var pr = a.play();
      if (pr && pr.then) pr.then(function(){ a.pause(); a.currentTime = 0; a.volume = 0.7; }).catch(function(){ a.volume = 0.7; });
      else { a.pause(); a.currentTime = 0; a.volume = 0.7; }
    } catch (e){}
  }
}, { once:true, passive:true });
function playSoundEffect(itemType){
  var key = itemType;
  if (itemType === 'necklace' || itemType === 'ring' || itemType === 'bracelet') key = 'jewelry';
  else if (itemType === 'helmet' || itemType === 'chest' || itemType === 'gloves' || itemType === 'leggings' || itemType === 'boots' || itemType === 'shield') key = 'armor';
  var a = soundEffects[key];
  if (!a) return;
  try {
    a.currentTime = 0;       /* 同一实例从头重播，与拖拽动作同步即时 */
    a.volume = 0.7;
    var pr = a.play();
    if (pr && pr.then) pr.catch(function(){});
  } catch (e){}
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
}

function slotHTML(item, small, label, idx){
  var h = '<div class="slot' + (item ? ' has-item' : '') + (small ? ' small' : '') + '"'
        + (idx != null ? ' data-slot="' + idx + '"' : '')
        + '">';
  if (label) h += '<span class="hint">' + label + '</span>';
  if (item){
    if (item.img) h += '<img class="item-img" src="' + item.img + '" alt="">';
    else h += '<span class="fill" style="--c:' + item.color + '"></span>';
    if (item.count > 1) h += '<span class="qty">' + item.count + '</span>';
  }
  h += '</div>';
  return h;
}

function renderEquip(){
  var html = '';
  EQUIP_ROWS.forEach(function(row, ri){
    row.forEach(function(e, ci){
      if (!e) return;
      var js = (ci < 2) ? 'end' : (ci === 3 ? 'start' : 'center');
      html += '<div class="eq-cell" data-eq="' + e.id + '" style="grid-column:' + (ci+1) + ';grid-row:' + (ri+1) + ';justify-self:' + js + '">'
        + slotHTML(equipState[e.id], e.small, e.label) + '</div>';
    });
  });
  equipEl.innerHTML = html;
}

function renderTabs(){
  var letters = ['I','II','III','IV','V'];
  tabsEl.innerHTML = letters.map(function(l, i){
    return '<div class="bag-tab' + (i===currentTab ? ' on' : '') + '" data-tab="' + i + '">' + l + '</div>';
  }).join('');
}

function renderBag(){
  gridEl.innerHTML = bag[currentTab].map(function(it, idx){
    return slotHTML(it, false, null, idx);
  }).join('');
}

/* ===== 穿戴/卸下：装备槽位 <-> 物品类型 映射 ===== */
var EQ_ACCEPT = {
  neck:'necklace', helm:'helmet', cloak:'cloak',
  ring1:'ring', ring2:'ring',
  glove:'gloves', armor:'chest',
  bangle1:'bracelet', bangle2:'bracelet',
  weapon:'weapon', leg:'leggings', boot:'boots',
  pet:'pet', mount:'mount'
};
/* 把物品放入背包第一个空格（按 I→V 页顺序，可跳过某槽） */
function placeInBag(item, skipBag, skipIdx){
  for (var p = 0; p < BAG_NUM; p++){
    for (var i = 0; i < BAG_SLOTS; i++){
      if (skipBag === p && skipIdx === i) continue;
      if (!bag[p][i]){ bag[p][i] = item; return true; }
    }
  }
  return false;
}
/* 穿到指定装备位：类型必须匹配，已有装备则换下放回背包 */
function equipTo(eqId, item, fromBag, fromSlot){
  var accept = EQ_ACCEPT[eqId];
  if (!accept){ toast('该部位暂不可装备'); return; }
  if (item.type !== accept){ toast('类型不符，无法穿戴'); return; }
  var old = equipState[eqId];
  if (old){ if (!placeInBag(old)){ toast('背包已满，无法更换'); return; } }
  bag[fromBag][fromSlot] = null;
  equipState[eqId] = item;
  playSoundEffect(item.type);
  renderEquip(); renderBag();
  toast('已穿戴 ' + item.name);
}
/* 自动穿戴：找该类型第一个空格位（无空位则用第一个） */
function autoEquip(item, fromBag, fromSlot){
  var type = item.type, candidates = [];
  for (var k in EQ_ACCEPT){ if (EQ_ACCEPT[k] === type) candidates.push(k); }
  if (!candidates.length){ toast('该物品无法穿戴'); return; }
  var target = null;
  for (var i = 0; i < candidates.length; i++){
    if (!equipState[candidates[i]]){ target = candidates[i]; break; }
  }
  if (!target) target = candidates[0];
  equipTo(target, item, fromBag, fromSlot);
}
/* 卸下：装备放回背包第一个空格 */
function unequip(eqId){
  var item = equipState[eqId];
  if (!item) return;
  if (!placeInBag(item)){ toast('背包已满，无法卸下'); return; }
  equipState[eqId] = null;
  playSoundEffect(item.type);
  renderEquip(); renderBag();
  toast('已卸下 ' + item.name);
}
/* 卸下到指定背包槽位：目标槽有物品则把它移到空格，再放入目标槽 */
function unequipTo(eqId, targetIdx){
  var item = equipState[eqId];
  if (!item) return;
  if (targetIdx < 0 || targetIdx >= BAG_SLOTS) return;
  var page = bag[currentTab];
  var occupying = page[targetIdx];
  page[targetIdx] = null;
  if (occupying){
    if (!placeInBag(occupying, currentTab, targetIdx)){
      page[targetIdx] = occupying;
      toast('背包已满，无法卸下'); return;
    }
  }
  equipState[eqId] = null;
  page[targetIdx] = item;
  playSoundEffect(item.type);
  renderEquip(); renderBag();
  toast('已卸下 ' + item.name);
}

function bindEvents(){
  equipEl.addEventListener('click', function(e){
    if (suppressClick){ suppressClick = false; return; }
    var cell = e.target.closest('.eq-cell'); if (!cell) return;
    var eqId = cell.getAttribute('data-eq');
    toast(equipState[eqId] ? equipState[eqId].name : '装备位 · 空');
  });

  tabsEl.addEventListener('click', function(e){
    var t = e.target.closest('.bag-tab'); if (!t) return;
    currentTab = parseInt(t.getAttribute('data-tab'), 10);
    renderTabs(); renderBag();
  });

  gridEl.addEventListener('click', function(e){
    if (suppressClick){ suppressClick = false; return; }
    var s = e.target.closest('.slot'); if (!s) return;
    var it = bag[currentTab][parseInt(s.getAttribute('data-slot'),10)];
    toast(it ? it.name + (it.count>1 ? ' ×' + it.count : '') : '背包格 · 空');
  });

  /* ===== 拖拽 & 长按：背包互换 / 跨背包放入 / 穿戴 / 卸下 ===== */
  var drag = null, dragGhost = null, dragDist = 0, suppressClick = false;
  var lpTimer = null, lpItem = null, lpKind = null;
  function clearHover(){
    var ov = gridEl.querySelector('.slot.drag-over');
    if (ov) ov.classList.remove('drag-over');
    var ev = equipEl.querySelector('.eq-cell.drag-over');
    if (ev) ev.classList.remove('drag-over');
    var tv = tabsEl.querySelector('.bag-tab.drag-tab-over');
    if (tv) tv.classList.remove('drag-tab-over');
  }
  function clearDrag(){
    if (dragGhost){ dragGhost.remove(); dragGhost = null; }
    var from = gridEl.querySelector('.slot.drag-from');
    if (from) from.classList.remove('drag-from');
    var ef = equipEl.querySelector('.slot.drag-from');
    if (ef) ef.classList.remove('drag-from');
    clearHover();
    drag = null;
    if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
    lpItem = null; lpKind = null;
  }
  function makeGhost(item){
    var g = document.createElement('div');
    g.className = 'drag-ghost';
    var inner = item.img
      ? '<img src="' + item.img + '" alt="">'
      : '<span class="fill" style="--c:' + item.color + '"></span>';
    g.innerHTML = inner + (item.count > 1 ? '<span class="qty">' + item.count + '</span>' : '');
    document.body.appendChild(g);
    return g;
  }
  /* 长按触发：背包物品→自动穿戴；装备位→卸下 */
  function onLongPress(){
    if (!drag || drag.active){ return; }
    lpTimer = null;
    if (lpKind === 'bag') autoEquip(lpItem, drag.bag, drag.from);
    else if (lpKind === 'equip') unequip(drag.eq);
    suppressClick = true;
    var from = gridEl.querySelector('.slot.drag-from');
    if (from) from.classList.remove('drag-from');
    var ef = equipEl.querySelector('.slot.drag-from');
    if (ef) ef.classList.remove('drag-from');
    try { gridEl.releasePointerCapture && gridEl.releasePointerCapture(); } catch (e2){}
    try { equipEl.releasePointerCapture && equipEl.releasePointerCapture(); } catch (e3){}
    drag = null; lpItem = null; lpKind = null;
    if (navigator.vibrate) navigator.vibrate(15);
  }

  /* 背包格：按住拖动 / 长按自动穿戴 */
  gridEl.addEventListener('pointerdown', function(e){
    var s = e.target.closest('.slot');
    if (!s || !s.classList.contains('has-item')) return;
    var idx = parseInt(s.getAttribute('data-slot'), 10);
    var it = bag[currentTab][idx];
    if (!it) return;
    clearTimeout(lpTimer); lpTimer = null; lpItem = null; lpKind = null;
    drag = { src:'bag', bag: currentTab, from: idx, eq: null, x: e.clientX, y: e.clientY, active:false };
    dragDist = 0;
    s.classList.add('drag-from');
    gridEl.setPointerCapture(e.pointerId);
    lpKind = 'bag'; lpItem = it;
    lpTimer = setTimeout(onLongPress, 520);
  });
  /* 装备位：按住拖动卸下 / 长按卸下 */
  equipEl.addEventListener('pointerdown', function(e){
    var cell = e.target.closest('.eq-cell'); if (!cell) return;
    var s = cell.querySelector('.slot');
    if (!s || !s.classList.contains('has-item')) return;
    var eqId = cell.getAttribute('data-eq');
    var it = equipState[eqId];
    if (!it) return;
    clearTimeout(lpTimer); lpTimer = null; lpItem = null; lpKind = null;
    drag = { src:'equip', bag:-1, from:-1, eq: eqId, x: e.clientX, y: e.clientY, active:false };
    dragDist = 0;
    s.classList.add('drag-from');
    equipEl.setPointerCapture(e.pointerId);
    lpKind = 'equip'; lpItem = it;
    lpTimer = setTimeout(onLongPress, 520);
  });
  var lastHit = null, lastHitTime = 0;
  document.addEventListener('pointermove', function(e){
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    dragDist = Math.max(dragDist, Math.sqrt(dx*dx + dy*dy));
    if (dragDist > 7){
      if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; lpItem = null; lpKind = null; }
      if (!drag.active){
        drag.active = true;
        lastHit = null; lastHitTime = 0;
        var item = drag.src === 'bag' ? bag[drag.bag][drag.from] : equipState[drag.eq];
        dragGhost = makeGhost(item);
        dragGhost.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0) translate(-50%,-50%)';
        e.preventDefault();
      }
    }
    if (drag.active && dragGhost){
      dragGhost.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0) translate(-50%,-50%)';
      var now = Date.now();
      if (now - lastHitTime > 40){   /* 节流命中检测，降低手机卡顿 */
        lastHitTime = now;
        var el = document.elementFromPoint(e.clientX, e.clientY);
        if (el !== lastHit){
          clearHover();
          lastHit = el;
          if (el){
            var ht = el.closest ? el.closest('.bag-tab') : null;
            if (ht) ht.classList.add('drag-tab-over');
            var he = el.closest ? el.closest('.eq-cell') : null;
            if (he) he.classList.add('drag-over');
            var hs = el.closest ? el.closest('.slot') : null;
            if (hs && gridEl.contains(hs) && hs !== gridEl.querySelector('.slot.drag-from')) hs.classList.add('drag-over');
          }
        }
      }
    }
  });
  function endDrag(e){
    if (!drag) return;
    var moved = drag.active;
    if (drag.active){
      var el = document.elementFromPoint(e.clientX, e.clientY);
      if (drag.src === 'bag'){
        /* 松手在装备位 → 穿戴 */
        var eqCell = el && el.closest ? el.closest('.eq-cell') : null;
        if (eqCell){
          var eqId = eqCell.getAttribute('data-eq');
          var it = bag[drag.bag][drag.from];
          if (it) equipTo(eqId, it, drag.bag, drag.from);
        } else {
          /* 松手在 tab 头 → 跨背包放入空格 */
          var tab = el && el.closest ? el.closest('.bag-tab') : null;
          if (tab){
            var tBag = parseInt(tab.getAttribute('data-tab'), 10);
            var tbag = bag[tBag], slot = -1;
            for (var i = 0; i < tbag.length; i++){ if (!tbag[i]){ slot = i; break; } }
            if (slot >= 0){
              var si = bag[drag.bag][drag.from];
              bag[drag.bag][drag.from] = null;
              tbag[slot] = si;
              playSoundEffect(si.type);
              renderBag();
            } else { toast('该背包已满'); }
          } else {
            /* 松手在背包槽位 → 互换/移动 */
            var t = el && el.closest ? el.closest('.slot') : null;
            var ti = t ? parseInt(t.getAttribute('data-slot'), 10) : -1;
            var page = bag[drag.bag];
            if (t && ti >= 0 && ti < BAG_SLOTS && ti !== drag.from){
              var s2 = page[drag.from];
              var tg = page[ti];
              page[drag.from] = tg;
              page[ti] = s2;
              playSoundEffect(s2.type);
              renderBag();
            }
          }
        }
      } else if (drag.src === 'equip'){
        /* 从装备位拖出 → 卸下到拖拽对应的背包槽位；该槽被占则不互换、无法卸下 */
        var t = el && el.closest ? el.closest('.slot') : null;
        if (t && gridEl.contains(t)){
          var ti = parseInt(t.getAttribute('data-slot'), 10);
          var page = bag[currentTab];
          if (ti >= 0 && ti < BAG_SLOTS){
            if (page[ti]){
              toast('该位置已有物品，无法卸下');
            } else {
              var it = equipState[drag.eq];
              equipState[drag.eq] = null;
              page[ti] = it;
              playSoundEffect(it.type);
              renderEquip(); renderBag();
              toast('已卸下 ' + it.name);
            }
          }
        }
        /* 拖到非背包槽位（其他装备位/空白处）：不卸下 */
      }
    }
    clearDrag();
    if (moved) suppressClick = true;
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', function(){ clearDrag(); });
  document.addEventListener('lostpointercapture', function(e){ if (drag) endDrag(e); });

  $('#actions').addEventListener('click', function(e){
    var b = e.target.closest('.btn'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === '寻宝') doLoot();
    else if (act === '初始化') doInit();
    else if (act === '属性'){ location.hash = '#attrs'; }
    else toast('功能 · 演示中');
  });

  $('#attrs-back').addEventListener('click', function(){
    location.hash = '';
  });
}

/* ===== 角色数据 + 二级属性页 ===== */
var CHARACTER = {
  info: { name:'晓夜', level:1, cls:'斗士' },
  base: { 力量:10, 敏捷:10, 体质:10, 精神:10, 智力:10, 幸运:10 },
  combat: [
    {k:'生命值',v:'100'},{k:'物理攻击',v:'50'},
    {k:'魔法攻击',v:'0'},{k:'射击攻击',v:'0'},
    {k:'攻击属性',v:'无'},{k:'物理防御',v:'20'},
    {k:'防御属性',v:'无'},{k:'射击防御',v:'0'},
    {k:'攻击速度',v:'最快'},{k:'移动速度',v:'最快'}
  ],
  record: [
    {k:'击杀数',v:'0'},{k:'死亡数',v:'0'},
    {k:'决斗胜数',v:'0'},{k:'决斗败数',v:'0'}
  ]
};

/* 参考面板布局：属性两列三行成对展示 */
var ATTR_PAIRS = [['力量','精神'],['体质','敏捷'],['智力','幸运']];

function cRows(arr){
  var h = '';
  for (var i = 0; i < arr.length; i += 2){
    var a = arr[i], b = arr[i+1];
    h += '<div class="c-row">'
      + '<span class="c-pair"><span class="cl">' + a.k + '</span><span class="cv">' + a.v + '</span></span>'
      + (b ? '<span class="c-pair"><span class="cl">' + b.k + '</span><span class="cv">' + b.v + '</span></span>'
           : '<span></span>')
      + '</div>';
  }
  return h;
}

function renderAttrs(){
  $('#ch-name').textContent = CHARACTER.info.name;
  $('#ch-lv').textContent = 'Lv.' + CHARACTER.info.level;
  $('#ch-cls').textContent = '职业 · ' + CHARACTER.info.cls;
  $('#attr-alloc').innerHTML = ATTR_PAIRS.map(function(p){
    return '<div class="c-row">'
      + '<span class="c-pair"><span class="cl">' + p[0] + '</span><span class="cv">' + CHARACTER.base[p[0]] + '</span></span>'
      + '<span class="c-pair"><span class="cl">' + p[1] + '</span><span class="cv">' + CHARACTER.base[p[1]] + '</span></span>'
      + '</div>';
  }).join('');
  $('#combat-list').innerHTML = cRows(CHARACTER.combat);
  $('#record-list').innerHTML = cRows(CHARACTER.record);
}

function applyRoute(){
  var attrs = location.hash.indexOf('#attrs') >= 0;
  document.body.classList.toggle('show-attrs', attrs);   /* 属性页加宽舞台 */
  $('#view-main').style.display = attrs ? 'none' : 'block';
  $('#view-attrs').style.display = attrs ? 'block' : 'none';
  if (attrs) renderAttrs();
}
/* 统一页面转场：打开 / 返回均带过渡，后续新增页面接入 hash 路由即自动沿用 */
function route(){
  var attrs = location.hash.indexOf('#attrs') >= 0;
  var changed = attrs !== route.last;
  route.last = attrs;
  if (changed && !route.first){
    if (document.startViewTransition){          /* 顶级：View Transitions 原生交叠过渡 */
      document.startViewTransition(applyRoute);
    } else {                                     /* 备用：滑动淡入 */
      applyRoute();
      var shown = attrs ? $('#view-attrs') : $('#view-main');
      shown.classList.remove('view-enter');
      void shown.offsetWidth;
      shown.classList.add('view-enter');
    }
  } else {
    applyRoute();                                /* 首次加载不播动画 */
  }
  route.first = false;
}
route.first = true;
route.last = undefined;
window.addEventListener('hashchange', route);

function doLoot(){
  var page = bag[currentTab], idx = -1;
  for (var i = 0; i < page.length; i++){ if (!page[i]){ idx = i; break; } }
  if (idx < 0){ toast('背包已满'); return; }
  var b = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
  var item = createItem(b, { id: itemIdCounter++ });
  page[idx] = item;
  renderBag();
  toast('获得 ' + item.name);
}

function doInit(){
  /* 清空背包与装备位 */
  for (var p = 0; p < BAG_NUM; p++) for (var i = 0; i < BAG_SLOTS; i++) bag[p][i] = null;
  equipState = {};
  /* 生成初始物品并按顺序放入背包（参照 物品生成-初始化 逻辑） */
  itemIdCounter = 1;
  var items = buildInitialItems();
  var p2 = 0, i2 = 0;
  items.forEach(function(it){
    while (p2 < BAG_NUM && bag[p2][i2]){ i2++; if (i2 >= BAG_SLOTS){ i2 = 0; p2++; } }
    if (p2 >= BAG_NUM) return;
    bag[p2][i2] = it;
    i2++; if (i2 >= BAG_SLOTS){ i2 = 0; p2++; }
  });
  renderEquip(); renderBag();
  toast('已初始化 ' + items.length + ' 件物品');
}

renderEquip();
renderTabs();
renderBag();
renderAttrs();
/* 打开或刷新一律回到主页面：清除 URL 中残留的 #hash，路由据此回到物品栏 */
history.replaceState(null, '', location.href.split('#')[0]);
route();
bindEvents();
})();
